      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.30" />
    </linearGradient>

    <linearGradient id="l-cyan-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.90" />
