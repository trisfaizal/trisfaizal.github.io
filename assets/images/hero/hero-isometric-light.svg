<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none">

  <defs>
    <!-- Ambient technical glow gradients -->
    <radialGradient id="glow-cyan-main" cx="64%" cy="28%" r="35%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
