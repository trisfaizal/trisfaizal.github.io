		href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@700&display=swap"
		rel="stylesheet" />

		href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23fafaf9' stroke='%23e4e4e3' stroke-width='2'/%3E%3Cpath d='M23 31h54M23 50h35M23 69h54' stroke='%2300b86b' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E" />
	<link rel="stylesheet" href="../assets/css/main.css" />
	<link rel="stylesheet" href="../assets/css/contact.css" />
	<script src="../assets/js/contact.js" defer></script>
	<script>
		// Run immediately before page rendering to prevent flash of theme
		(function() {
			const savedTheme = localStorage.getItem('theme');
			const theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>
	<script src="../assets/js/main.js" defer></script>

	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "WebSite",
		"name": "TRISF PROJECT",
		"url": "https://trisf.id/contact/"
	}
	</script>
</head>

<body>
	<div class="ambient-background" aria-hidden="true">
		<div class="ambient-parallax">
			<div class="blob blob-1"></div>
			<div class="blob blob-2"></div>
			<div class="blob blob-3"></div>
			<div class="blob blob-4"></div>
			<div class="blob blob-5"></div>
		</div>
	</div>
	<a class="skip-link" href="#main">Skip to content</a>

	<header class="site-header">
		<nav class="navbar" aria-label="Primary navigation">
			<a class="brand" href="../" aria-label="TRISF home">TRISF <span class="brand-dot" aria-hidden="true">●</span></a>

			<div class="nav-controls">
				<button class="theme-toggle" aria-label="Toggle theme" id="theme-toggle-btn"></button>
				<button class="mobile-menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="primary-menu">
					<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="menu-icon"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
					<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="close-icon"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
				</button>
			</div>

			<!-- Main Navigation -->
			<div class="main-nav" id="primary-menu">
				<a href="../">Home</a>
				<a href="https://project.trisf.my.id/" target="_blank" rel="noopener noreferrer">Projects</a>
				<a href="https://blog.trisf.my.id/" target="_blank" rel="noopener noreferrer">Blog</a>
				<a href="./" aria-current="page">Contact</a>
			</div>
		</nav>
	</header>

	<main id="main" tabindex="-1">
		<section class="contact-section reveal">
			<div class="contact-intro">
				<div class="section-header-title">
					<span class="section-marker">//</span>
					<h1 class="section-heading">CONTACT</h1>
				</div>
				<h2 class="contact-intro-headline">Let's build something useful.</h2>
				<p class="contact-intro-desc">Have an idea, a problem to solve, or something worth building?<br>Send a message and I'll get back to you.</p>
			</div>

			<div class="form-card">
				<form id="contact-form" class="contact-form">
					<div class="form-group">
						<label for="name" class="form-label">Name</label>
						<input type="text" id="name" name="name" class="form-input" required autocomplete="name">
					</div>
					
					<div class="form-group">
						<label for="email" class="form-label">Email</label>
						<input type="email" id="email" name="email" class="form-input" required autocomplete="email">
					</div>
					
					<div class="form-group">
						<label for="subject" class="form-label">Subject</label>
						<input type="text" id="subject" name="subject" class="form-input" required>
					</div>
					
					<div class="form-group">
						<label for="message" class="form-label">Message</label>
						<textarea id="message" name="message" class="form-textarea" required></textarea>
					</div>
					
					<div class="form-actions">
						<button type="submit" class="submit-btn">
							<span class="btn-text">Send Message</span>
							<span class="cta-arrow" aria-hidden="true">↗</span>
						</button>
					</div>

					<div id="form-status" class="form-status" role="alert" aria-live="polite"></div>
				</form>
			</div>
		</section>
	</main>

	<footer class="site-footer">
		<div class="footer-inner">
			<p>TRISF &copy; <span data-year></span></p>
		</div>
	</footer>
</body>

</html>
